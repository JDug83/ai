<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GAZCHAT Studio — Private Local AI & Code Engine</title>

<!-- Client-side PDF generator library (zero cloud transmission) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
    --bg: #050711;
    --bg2: #0b1020;
    --panel: rgba(15, 20, 38, .88);
    --panel2: #11182b;
    --border: rgba(120, 160, 255, .16);
    --text: #f5f7ff;
    --muted: #8994ad;
    --accent: #7c5cff;
    --accent2: #00d4ff;
    --pink: #ff4fd8;
    --green: #35e88a;
    --red: #ff5577;
    --glow: rgba(124, 92, 255, .25);
    --bubble-user: rgba(255, 255, 255, .06);
    --code-bg: #03050a;
}

[data-mode="light"] {
    --bg: #f4f6fb;
    --bg2: #e9ecf5;
    --panel: rgba(255, 255, 255, .92);
    --panel2: #ffffff;
    --border: rgba(0, 50, 150, .12);
    --text: #1a1e2e;
    --muted: #647087;
    --glow: rgba(124, 92, 255, .15);
    --bubble-user: rgba(0, 0, 0, .05);
    --code-bg: #1e2230;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100dvh; margin: 0; overflow: hidden; position: fixed; }
body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 10% 10%, var(--glow), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(0, 212, 255, .08), transparent 25%),
        var(--bg);
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }

.app { width: 100%; height: 100dvh; display: flex; position: relative; }

.drawer-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
    z-index: 40; opacity: 0; transition: opacity 0.25s ease;
}
.drawer-backdrop.open { display: block; opacity: 1; }

.sidebar {
    width: 290px; height: 100dvh; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--panel); border-right: 1px solid var(--border);
    backdrop-filter: blur(25px); z-index: 50;
    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-header { display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 10px; color: white; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--pink));
    box-shadow: 0 0 20px var(--glow);
}
.logo-name { font-weight: 900; font-size: 19px; letter-spacing: -.6px; }
.logo-name span {
    background: linear-gradient(90deg, var(--accent2), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.btn-drawer-close { display: none; background: transparent; border: none; color: var(--muted); font-size: 20px; }

.user-profile-badge {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-radius: 10px; background: rgba(125, 125, 125, .08); border: 1px solid var(--border);
}
.user-profile-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 13px;
}
.user-profile-info { flex: 1; min-width: 0; }
.user-profile-name {
    font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.free-badge {
    font-size: 9px; color: #000; padding: 1px 5px; border-radius: 4px;
    font-weight: 900; background: var(--green);
}
.user-profile-email { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.new-chat {
    border: 1px solid var(--border); color: var(--text);
    background: linear-gradient(135deg, var(--glow), rgba(0, 212, 255, .04));
    border-radius: 12px; padding: 10px; font-weight: 700; text-align: center;
}
.section-label {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; margin: 4px 2px 0;
}
.chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.chat-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: 9px; color: var(--muted); font-size: 13px; user-select: none;
}
.chat-item.active { background: rgba(125, 125, 125, .12); border: 1px solid var(--border); color: var(--text); font-weight: 600; }
.chat-title-span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.chat-actions { display: flex; gap: 6px; }
.chat-action-btn { border: none; background: transparent; color: var(--muted); font-size: 13px; padding: 4px; }

.local-status {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 9px; background: rgba(125, 125, 125, .05); border: 1px solid var(--border); font-size: 11px;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
.status-dot.error { background: var(--red); box-shadow: 0 0 10px var(--red); }

.sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.btn-secondary {
    width: 100%; border: 1px solid var(--border); background: rgba(125, 125, 125, .05);
    color: var(--text); border-radius: 10px; padding: 9px; font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
}

.main { min-width: 0; flex: 1; display: flex; flex-direction: column; height: 100dvh; position: relative; }
.topbar {
    height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; padding-top: env(safe-area-inset-top); border-bottom: 1px solid var(--border);
    background: var(--panel); backdrop-filter: blur(20px); z-index: 20;
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.menu-toggle { display: none; background: transparent; border: none; color: var(--text); font-size: 20px; }
.topbar-title {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-actions { display: flex; gap: 6px; }
.top-btn { border: 1px solid var(--border); background: rgba(125, 125, 125, .06); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; }

.chat { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 150px; }
.chat-inner { max-width: 780px; margin: auto; }
.welcome { max-width: 580px; margin: 4vh auto 20px; text-align: center; }
.orb {
    width: 60px; height: 60px; display: grid; place-items: center; margin: 0 auto 12px;
    border-radius: 18px; font-size: 26px; color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--pink));
    box-shadow: 0 0 28px var(--glow);
}
.welcome h1 {
    margin: 0; font-size: clamp(26px, 7vw, 36px); letter-spacing: -1.2px;
    background: linear-gradient(90deg, var(--text), var(--accent2), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.welcome p { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }

.suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
.suggestion {
    text-align: left; padding: 11px; border-radius: 10px; color: var(--text);
    background: rgba(125, 125, 125, .04); border: 1px solid var(--border); font-size: 12px;
}

.message { display: flex; gap: 10px; margin: 16px 0; }
.avatar {
    width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center;
    border-radius: 8px; color: white; font-size: 12px;
}
.message.user .avatar { background: linear-gradient(135deg, var(--accent), var(--pink)); }
.message.ai .avatar { background: linear-gradient(135deg, var(--accent2), var(--accent)); }
.bubble { min-width: 0; max-width: 88%; line-height: 1.55; font-size: 14px; overflow-wrap: anywhere; }
.message.user .bubble { padding: 9px 12px; border-radius: 4px 14px 14px 14px; background: var(--bubble-user); border: 1px solid var(--border); }
.file-attachment-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px;
    border-radius: 6px; background: rgba(125, 125, 125, .15); border: 1px solid var(--border);
    font-size: 11px; color: var(--accent2); margin-bottom: 6px;
}
.bubble p { margin: 0 0 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble code { padding: 2px 4px; border-radius: 4px; background: rgba(125, 125, 125, .15); color: var(--accent2); font-size: 13px; }

.code-wrap {
    margin: 8px 0; border-radius: 8px; border: 1px solid var(--border);
    background: var(--code-bg); overflow: hidden;
}
.code-header {
    min-height: 30px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px; background: rgba(255, 255, 255, .04); border-bottom: 1px solid var(--border);
    font-size: 10px; color: var(--muted);
}
.code-actions { display: flex; gap: 4px; }
.code-btn {
    border: 0; background: rgba(125, 125, 125, .12); color: var(--muted);
    padding: 3px 6px; border-radius: 4px; font-size: 10px;
}
.code-btn:hover { background: rgba(125, 125, 125, .25); color: var(--text); }
.code-btn.run-btn { color: var(--green); background: rgba(53, 232, 138, .12); }
pre { margin: 0; padding: 10px; overflow-x: auto; font-size: 11.5px; line-height: 1.5; color: #dce5ff; }

.code-output {
    display: none; padding: 8px 10px; background: rgba(0, 0, 0, 0.4);
    border-top: 1px solid var(--border); font-family: monospace; font-size: 11px;
    color: var(--accent2); white-space: pre-wrap;
}

.message-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-action-btn {
    border: 1px solid var(--border); background: rgba(125, 125, 125, .06);
    color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 6px;
}
.msg-action-btn:hover { color: var(--text); background: rgba(125, 125, 125, .15); }

.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: bounce 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

.model-loading {
    display: none; margin: 6px auto 14px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 9px; color: var(--muted); background: rgba(125, 125, 125, .05); font-size: 11px;
}
.model-loading.show { display: block; }
.progress { height: 4px; margin-top: 6px; border-radius: 4px; overflow: hidden; background: rgba(125, 125, 125, .1); }
.progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--pink)); transition: width .2s; }

.composer-area {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 12px max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 80%, transparent); z-index: 30;
}
.composer { max-width: 780px; margin: auto; }
.pending-attachment {
    display: none; align-items: center; gap: 8px; padding: 5px 10px; margin-bottom: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; width: fit-content;
}
.pending-attachment.active { display: flex; }
.pending-attachment button { background: transparent; border: none; color: var(--red); font-size: 13px; }

.input-box {
    display: flex; align-items: flex-end; gap: 4px; padding: 6px; border-radius: 18px;
    border: 1px solid var(--border); background: var(--panel2); backdrop-filter: blur(20px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
}
textarea {
    flex: 1; min-height: 38px; max-height: 120px; resize: none; outline: 0; border: 0;
    background: transparent; color: var(--text); padding: 8px 6px; line-height: 1.4; font-size: 15px;
}
.tool, .send { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border-radius: 12px; border: 0; }
.tool { color: var(--muted); background: rgba(125, 125, 125, .08); font-size: 15px; }
.tool.recording { background: var(--red); color: white; }
.send { color: white; background: linear-gradient(135deg, var(--accent), var(--accent2), var(--pink)); font-size: 13px; }
.send:disabled { opacity: .4; }
.disclaimer { text-align: center; margin-top: 4px; color: var(--muted); font-size: 9px; }

.modal-bg {
    position: fixed; inset: 0; z-index: 100; display: none; place-items: center;
    background: rgba(0, 0, 0, .7); backdrop-filter: blur(8px); padding: 16px;
}
.modal-bg.open { display: grid; }
.modal {
    width: 100%; max-width: 480px; max-height: 85dvh; overflow-y: auto; padding: 18px;
    border-radius: 16px; background: var(--panel2); border: 1px solid var(--border);
}
.modal h2 { margin: 0 0 12px; font-size: 17px; }
.setting-group { margin-bottom: 14px; }
.setting-label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
.setting-input {
    width: 100%; padding: 10px 12px; border-radius: 8px; outline: 0; color: var(--text);
    background: rgba(125, 125, 125, .07); border: 1px solid var(--border); font-size: 13px;
}
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.theme-choice { padding: 9px; border-radius: 8px; border: 1px solid var(--border); color: var(--text); background: rgba(125, 125, 125, .05); font-size: 12px; }
.theme-choice.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.modal-actions button { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 12px; }
.cancel { color: var(--muted); background: rgba(125, 125, 125, .08); }
.save { color: white; background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight: 600; }

@media (max-width: 820px) {
    .menu-toggle { display: inline-flex; }
    .btn-drawer-close { display: block; }
    .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .suggestions { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleSidebar(false)"></div>

<div class="app">

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="logo">
            <div class="logo-icon">✦</div>
            <div class="logo-name">GAZ<span>STUDIO</span></div>
        </div>
        <button class="btn-drawer-close" onclick="toggleSidebar(false)">✕</button>
    </div>

    <div class="user-profile-badge" id="userProfileCard">
        <div class="user-profile-avatar" id="userAvatarChar">G</div>
        <div class="user-profile-info">
            <div class="user-profile-name">
                <span id="profileName">Guest Developer</span>
                <span class="free-badge">FREE</span>
            </div>
            <div class="user-profile-email" id="profileEmail">Local Storage Sync</div>
        </div>
        <button class="chat-action-btn" onclick="openAuthModal()" title="Switch Profile">👤</button>
    </div>

    <button class="new-chat" onclick="createNewChat()">＋ New Workspace</button>

    <div class="section-label"><span>Workspaces</span></div>
    <div class="chat-list" id="chatList"></div>

    <div class="section-label">On-Device Engine</div>
    <div class="local-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="localStatus">Checking device...</span>
    </div>

    <div class="sidebar-bottom">
        <button class="btn-secondary" onclick="openCreateFileModal()">📄 New Snippet / File</button>
        <button class="btn-secondary" onclick="toggleLightDarkMode()">
            <span id="modeIcon">☀️</span> <span id="modeLabel">Light Mode</span>
        </button>
        <button class="btn-secondary" onclick="openSettings()">⚙ Settings</button>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="toggleSidebar(true)">☰</button>
            <div class="topbar-title">
                <span class="status-dot" id="modelDot"></span>
                <span id="activeChatHeader">GazChat Studio</span>
            </div>
        </div>
        <div class="top-actions">
            <button class="top-btn" onclick="speakLast()" title="Voice Readout">🔊 Voice</button>
            <button class="top-btn" onclick="openSettings()">⚙</button>
        </div>
    </header>

    <section class="chat" id="chat">
        <div class="chat-inner" id="chatInner">
            <div class="model-loading" id="modelLoading">
                <div id="loadingText">Preparing local AI...</div>
                <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            </div>
            <div id="messagesContainer"></div>
        </div>
    </section>

    <div class="composer-area">
        <div class="composer">
            <div class="pending-attachment" id="pendingAttachment">
                <span id="pendingFileIcon">📄</span>
                <span id="pendingFileName">file.txt</span>
                <button onclick="clearPendingAttachment()">✕</button>
            </div>

            <div class="input-box">
                <input type="file" id="fileInput" accept=".txt,.js,.py,.html,.css,.json,.md,.csv,.sql" style="display:none;" onchange="handleFileUpload(event)">
                <button class="tool" onclick="document.getElementById('fileInput').click()" title="Attach Code/Text">📎</button>
                <button class="tool" onclick="openCreateFileModal()" title="Draft Snippet">📄</button>
                <button class="tool" id="micBtn" onclick="startVoice()" title="Dictation">🎙️</button>
                <textarea id="messageInput" rows="1" placeholder="Ask for code, algorithms, notes, or explanations..." onkeydown="handleKey(event)" oninput="resizeInput(this)"></textarea>
                <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
            <div class="disclaimer">Private On-Device AI • Exports TXT, PDF, Code • Local Execution</div>
        </div>
    </div>
</main>
</div>

<!-- Modal: User Profile -->
<div class="modal-bg" id="authModal">
    <div class="modal">
        <h2>👤 Developer Profile</h2>
        <div class="setting-group">
            <label class="setting-label">Display Name</label>
            <input type="text" class="setting-input" id="authNameInput" placeholder="Your Name">
        </div>
        <div class="setting-group">
            <label class="setting-label">Workspace Identifier</label>
            <input type="email" class="setting-input" id="authEmailInput" placeholder="developer@local.ai">
        </div>
        <div class="modal-actions">
            <button class="cancel" onclick="closeAuthModal()">Cancel</button>
            <button class="save" onclick="saveFreeAccount()">Save Profile</button>
        </div>
    </div>
</div>

<!-- Modal: Create / Edit Document -->
<div class="modal-bg" id="createFileModal">
    <div class="modal">
        <h2>📄 Create Document or Snippet</h2>
        <div class="setting-group">
            <label class="setting-label">File Name</label>
            <input type="text" class="setting-input" id="newFileNameInput" placeholder="script.py, document.txt, app.html">
        </div>
        <div class="setting-group">
            <label class="setting-label">File Content</label>
            <textarea class="setting-input" id="newFileContentInput" rows="7" placeholder="Write text or paste code here..." style="font-family:monospace; resize:vertical;"></textarea>
        </div>
        <div class="modal-actions">
            <button class="cancel" onclick="closeCreateFileModal()">Cancel</button>
            <button class="btn-secondary" style="width:auto;" onclick="downloadModalAsTxt()">💾 TXT</button>
            <button class="btn-secondary" style="width:auto;" onclick="downloadModalAsPdf()">📄 PDF</button>
            <button class="save" onclick="attachCreatedFileToChat()">📎 Attach to Chat</button>
        </div>
    </div>
</div>

<!-- Modal: Settings -->
<div class="modal-bg" id="modal">
    <div class="modal">
        <h2>⚙ GAZCHAT Studio Settings</h2>
        <div class="setting-group">
            <label class="setting-label">System Instructions (Prompt)</label>
            <textarea class="setting-input" id="systemPromptInput" rows="3" style="resize:vertical;"></textarea>
        </div>
        <div class="setting-group">
            <label class="setting-label">Accent Theme</label>
            <div class="theme-grid">
                <button class="theme-choice" id="themePurple" onclick="setAccent('purple')">🟣 Purple</button>
                <button class="theme-choice" id="themeBlue" onclick="setAccent('blue')">🔵 Blue</button>
                <button class="theme-choice" id="themePink" onclick="setAccent('pink')">🩷 Pink</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="cancel" onclick="closeSettings()">Cancel</button>
            <button class="save" onclick="saveSettings()">Save Changes</button>
        </div>
    </div>
</div>

<script type="module">
import { pipeline, TextStreamer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3";

env.allowLocalModels = false;
env.useBrowserCache = true;

// Ultra-fast, intelligent, memory-safe model (~350MB weights, <600MB tab RAM)
const MODEL_ID = "onnx-community/Qwen2.5-0.5B-Instruct";

const DEFAULT_SYSTEM_PROMPT = `You are GAZCHAT Studio, an expert developer and technical assistant running locally in-browser.
- You specialize in clean, modular, production-ready code (JavaScript, Python, HTML/CSS, SQL, Bash).
- Always wrap code blocks with exact language syntax headers (e.g. \`\`\`javascript, \`\`\`python, \`\`\`html).
- Provide immediate, structured, fluff-free responses with technical precision.`;

let currentUser = JSON.parse(localStorage.getItem("gaz_free_user") || "null");

function getStorageKey(key) {
    if (currentUser?.email) {
        const safe = currentUser.email.toLowerCase().replace(/[^a-z0-9]/g, "_");
        return `gaz_user_${safe}_${key}`;
    }
    return `gaz_guest_${key}`;
}

/* ================= EXPORT TOOLS: TXT & PDF ================= */
window.downloadFile = function(filename, content, type = "text/plain;charset=utf-8") {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
};

window.exportTextToPdf = function(filename, text) {
    if (!window.jspdf) {
        alert("PDF generator loading, please retry in a moment.");
        return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "letter" });
    
    doc.setFont("Helvetica", "normal");
    doc.setFontSize(10);
    doc.setTextColor(30, 30, 30);

    const margin = 40;
    const pageWidth = doc.internal.pageSize.getWidth() - (margin * 2);
    
    // Clean markdown hashes for clean print
    const cleanText = text.replace(/```[\s\S]*?```/g, m => "\n[CODE BLOCK]\n" + m.replace(/```[a-z]*/g, "") + "\n[/CODE BLOCK]\n");
    const splitText = doc.splitTextToSize(cleanText, pageWidth);

    let cursorY = 50;
    for (let i = 0; i < splitText.length; i++) {
        if (cursorY > 740) {
            doc.addPage();
            cursorY = 50;
        }
        doc.text(splitText[i], margin, cursorY);
        cursorY += 14;
    }
    doc.save(filename || "document.pdf");
};

window.runCodeBlock = function(btn) {
    const wrap = btn.closest(".code-wrap");
    const lang = wrap?.querySelector(".code-header span")?.innerText?.trim().toLowerCase();
    const code = wrap?.querySelector("code")?.innerText;
    const out = wrap?.querySelector(".code-output");
    if (!code || !out) return;

    out.style.display = "block";
    out.textContent = "Executing...";

    if (lang === "javascript" || lang === "js") {
        try {
            let logs = [];
            const customConsole = {
                log: (...args) => logs.push(args.map(a => typeof a === "object" ? JSON.stringify(a) : a).join(" ")),
                error: (...args) => logs.push("ERROR: " + args.join(" "))
            };
            const runner = new Function("console", code);
            runner(customConsole);
            out.textContent = logs.length > 0 ? logs.join("\n") : "Execution finished (No console output).";
        } catch (e) {
            out.textContent = "Runtime Error: " + e.message;
        }
    } else if (lang === "html") {
        const previewWin = window.open("", "_blank");
        previewWin.document.write(code);
        previewWin.document.close();
        out.textContent = "Rendered in standalone preview window.";
    } else {
        out.textContent = `Live execution is directly supported for JavaScript & HTML. Export as .${lang || "txt"} to execute in your local CLI.`;
    }
};

    else if (lang === "html") ext = "html";

/* ================= MODEL INSPECTION & MEMORY-SAFE LOADER ================= */
function setStatus(text, error = false) {
    localStatus.textContent = text;
    statusDot.classList.toggle("error", error);
    modelDot.classList.toggle("error", error);
}

async function getDeviceConfig() {
    if (!navigator.gpu) return { device: "wasm", dtype: "q8", desc: "CPU (Safe WASM)" };
    try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) return { device: "wasm", dtype: "q8", desc: "CPU (Safe WASM)" };
        return { device: "webgpu", dtype: "q4", desc: "WebGPU (Accelerated)" };
    } catch {
        return { device: "wasm", dtype: "q8", desc: "CPU (Safe WASM)" };
    }
}

async function loadModel() {
    if (modelLoaded) return generator;
    if (modelLoading) {
        while (modelLoading) await new Promise(r => setTimeout(r, 100));
        return generator;
    }

    modelLoading = true;
    modelLoadingBox.classList.add("show");

    const config = await getDeviceConfig();
    loadingText.textContent = `Loading Qwen2.5 0.5B (${config.desc})...`;

    const initEngine = async (device, dtype) => {
        return await pipeline("text-generation", MODEL_ID, {
            device,
            dtype,
            session_options: {
                executionMode: "sequential",
                graphOptimizationLevel: "basic"
            },
            progress_callback: (d) => {
                if (d.status === "progress" && typeof d.progress === "number") {
                    const percent = Math.round(d.progress);
                    progressBar.style.width = percent + "%";
                    loadingText.textContent = `Fetching Engine (${d.file || "weights"}): ${percent}%`;
                }
            }
        });
    };

    try {
        generator = await initEngine(config.device, config.dtype);
        modelLoaded = true;
        modelLoading = false;
        modelLoadingBox.classList.remove("show");
        setStatus(`Qwen2.5 Ready • ${config.desc}`, false);
        return generator;
    } catch (gpuError) {
        console.warn("Falling back to CPU...", gpuError);
        try {
            loadingText.textContent = "Switching to CPU safe mode...";
            generator = await initEngine("wasm", "q8");
            modelLoaded = true;
            modelLoading = false;
            modelLoadingBox.classList.remove("show");
            setStatus("Qwen2.5 Ready • CPU Safe", false);
            return generator;
        } catch (err) {
            modelLoading = false;
            modelLoaded = false;
            modelLoadingBox.classList.remove("show");
            setStatus("Engine Error", true);
            throw err;
        }
    }
}

/* ================= INFERENCE PIPELINE ================= */
window.sendMessage = async function() {
    if (generating) return;
    const text = input.value.trim();
    const currentAttachment = attachedPayload;
    if (!text && !currentAttachment) return;

    input.value = "";
    resizeInput(input);
    clearPendingAttachment();

    const curChat = getActiveChat();
    if (!curChat) return;

    const summaryTitle = text ? text.slice(0, 22) : (currentAttachment?.name || "Code Session");
    if (curChat.history.length === 0 && curChat.title.startsWith("Workspace")) {
        curChat.title = summaryTitle;
        activeChatHeader.textContent = curChat.title;
        renderChatList();
    }

    let finalPrompt = text;
    if (currentAttachment && currentAttachment.type === "file") {
        const safeSnippet = currentAttachment.content.length > 3500 
            ? currentAttachment.content.slice(0, 3500) + "\n...[Truncated for RAM safety]"
            : currentAttachment.content;
        finalPrompt = `[Context File: ${currentAttachment.name}]\n\`\`\`\n${safeSnippet}\n\`\`\`\n${text || "Analyze and optimize this file."}`;
    }

    curChat.history.push({ role: "user", content: text || `[Attached: ${currentAttachment?.name}]`, attachment: currentAttachment });
    appendMessageNode("user", text || `[Attached: ${currentAttachment?.name}]`, currentAttachment);
    saveChats();

    generating = true;
    sendBtn.disabled = true;

    const wb = document.getElementById("welcomeBox");
    if (wb) wb.remove();

    const aiMsg = document.createElement("div");
    aiMsg.className = "message ai";
    aiMsg.innerHTML = `
        <div class="avatar">✦</div>
        <div class="bubble">
            <div class="typing" id="streamTyping"><i></i><i></i><i></i></div>
            <div id="streamTarget"></div>
        </div>
    `;
    messagesContainer.appendChild(aiMsg);
    scrollBottom();

    const streamTarget = aiMsg.querySelector("#streamTarget");
    const streamTyping = aiMsg.querySelector("#streamTyping");

    try {
        const tModel = await loadModel();

        // Keep last 4 turns to avoid KV-Cache memory exhaustion
        const contextMessages = curChat.history.slice(-4).map(m => ({
            role: m.role,
            content: m.content
        }));

        if (currentAttachment && currentAttachment.type === "file") {
            contextMessages[contextMessages.length - 1].content = finalPrompt;
        }

        const messages = [
            { role: "system", content: `${customPrompt}\nDeveloper: ${userName}` },
            ...contextMessages
        ];

        let rawBuffer = "";
        const streamer = new TextStreamer(tModel.tokenizer, {
            skip_prompt: true,
            skip_special_tokens: true,
            callback_function: (chunk) => {
                if (streamTyping) streamTyping.remove();
                rawBuffer += chunk;
                let clean = rawBuffer.replace(/^<think>[\s\S]*?<\/think>\s*/i, "").replace(/^<think>[\s\S]*/i, "");
                streamTarget.innerHTML = markdown(clean);
                scrollBottom();
            }
        });

        await tModel(messages, {
            max_new_tokens: 450,
            temperature: 0.5,
            top_p: 0.85,
            do_sample: true,
            streamer: streamer
        });

        const finalOutput = rawBuffer.replace(/^<think>[\s\S]*?<\/think>\s*/i, "").trim() || "Execution complete.";
        streamTarget.innerHTML = markdown(finalOutput);

        lastAnswer = finalOutput;
        curChat.history.push({ role: "assistant", content: finalOutput });
        saveChats();

        // Export Actions Toolbar
        const actionsBar = document.createElement("div");
        actionsBar.className = "message-actions";

        const copyBtn = document.createElement("button");
        copyBtn.className = "msg-action-btn";
        copyBtn.innerHTML = "📋 Copy";
        copyBtn.onclick = () => copyTextContent(finalOutput, copyBtn);

        const saveTxtBtn = document.createElement("button");
        saveTxtBtn.className = "msg-action-btn";
        saveTxtBtn.innerHTML = "💾 Export .TXT";
        saveTxtBtn.onclick = () => downloadFile("gazchat_output.txt", finalOutput, "text/plain");

        const savePdfBtn = document.createElement("button");
        savePdfBtn.className = "msg-action-btn";
        savePdfBtn.innerHTML = "📄 Export .PDF";
        savePdfBtn.onclick = () => exportTextToPdf("gazchat_document.pdf", finalOutput);

        actionsBar.appendChild(copyBtn);
        actionsBar.appendChild(saveTxtBtn);
        actionsBar.appendChild(savePdfBtn);
        aiMsg.querySelector(".bubble").appendChild(actionsBar);

        if (autoVoiceResponse) {
            speakResponse(finalOutput);
            autoVoiceResponse = false;
        }
    } catch (err) {
        if (streamTyping) streamTyping.remove();
        streamTarget.innerHTML = `<p style="color:var(--red);">⚠️ Engine Notice: ${err.message || err}</p>`;
    } finally {
        generating = false;
        sendBtn.disabled = false;
    }
};

/* ================= VOICE & UTILS ================= */
function speakResponse(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/```[\s\S]*?```/g, "Code block omitted.").replace(/[*_#`]/g, "");
    const utterance = new SpeechSynthesisUtterance(clean.slice(0, 1500));
    utterance.rate = 1.05;
    window.speechSynthesis.speak(utterance);
}
window.speakLast = function() { if (lastAnswer) speakResponse(lastAnswer); };

window.startVoice = function() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) return alert("Speech recognition is unavailable in this browser.");
    const rec = new SpeechRec();
    rec.lang = navigator.language || "en-US";
    micBtn.classList.add("recording");
    rec.onresult = (e) => {
        micBtn.classList.remove("recording");
        input.value = e.results[0][0].transcript;
        resizeInput(input);
        autoVoiceResponse = true;
        sendMessage();
    };
    rec.onerror = () => micBtn.classList.remove("recording");
    rec.onend = () => micBtn.classList.remove("recording");
    rec.start();
};

function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
}

function markdown(text) {
    let out = escapeHTML(text);
    // Custom Code Block Parser with Live Execution & Export buttons
    out = out.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        const cleanLang = (lang || "code").toLowerCase();
        const canRun = cleanLang === "javascript" || cleanLang === "js" || cleanLang === "html";
        return `
            <div class="code-wrap">
                <div class="code-header">
                    <span>${cleanLang}</span>
                    <div class="code-actions">
                        ${canRun ? `<button class="code-btn run-btn" onclick="runCodeBlock(this)">▶ Run</button>` : ''}
                        <button class="code-btn" onclick="copyCode(this)">📋 Copy</button>
                        <button class="code-btn" onclick="saveCodeBlock(this)">💾 Export</button>
                    </div>
                </div>
                <pre><code>${code.trim()}</code></pre>
                <div class="code-output"></div>
            </div>
        `;
    });
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    out = out.replace(/^## (.*)$/gm, "<h2>$1</h2>");
    out = out.replace(/^[-*] (.*)$/gm, "• $1<br>");
    out = out.replace(/\n\n/g, "</p><p>");
    out = out.replace(/\n/g, "<br>");
    return `<p>${out}</p>`;
}

function scrollBottom() {
    requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
}
window.resizeInput = function(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
};
window.handleKey = function(e) {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 820) {
        e.preventDefault();
        sendMessage();
    }
};
window.useSuggestion = function(txt) {
    input.value = txt;
    resizeInput(input);
    sendMessage();
};

window.openSettings = function() {
    document.getElementById("systemPromptInput").value = customPrompt;
    document.getElementById("modal").classList.add("open");
    toggleSidebar(false);
};
window.closeSettings = function() { document.getElementById("modal").classList.remove("open"); };
window.saveSettings = function() {
    customPrompt = document.getElementById("systemPromptInput").value.trim() || DEFAULT_SYSTEM_PROMPT;
    localStorage.setItem("gaz_system_prompt", customPrompt);
    localStorage.setItem("gaz_theme", colorTheme);
    closeSettings();
};

applyAccent(colorTheme);
applyLightDarkMode(lightMode);
updateUserAuthUI();
loadUserScopedChats();

setTimeout(async () => {
    const config = await getDeviceConfig();
    setStatus(`${config.desc} Online`, false);
}, 300);
</script>
